[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-odata-agent"
version = "0.1.0"
description = "MVP scaffold for a controlled SAP OData agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.7,<3.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
agent = [
    "mcp>=1.0,<2.0",
]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.0,<9.0",
]

[project.scripts]
sap-odata-build-index = "sap_odata_agent.tools.build_dual_source_index:main"
sapclaw-mcp = "sap_odata_agent.agent_tools.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
